<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Session Hub</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="topbar">
        <div class="topbar-brand" onclick="navigate('dashboard')">
            <span class="logo">⚡</span> AI Session Hub
        </div>
        <div class="topbar-search">
            <input type="text" id="global-search" placeholder="Search all sessions..." onkeydown="if(event.key==='Enter')doSearch(this.value)">
        </div>
        <div class="topbar-actions">
            <button onclick="triggerSync()" id="sync-btn" class="btn btn-sm">⟳ Sync</button>
        </div>
    </nav>

    <main id="app">
        <!-- Dashboard -->
        <div id="view-dashboard" class="view">
            <div class="stats-grid" id="stats-grid"></div>
            <h2>Recent Sessions</h2>
            <div id="recent-sessions" class="session-list"></div>
        </div>

        <!-- Browse Sessions -->
        <div id="view-browse" class="view hidden">
            <div class="filters">
                <select id="filter-tool" onchange="loadSessions(1)">
                    <option value="">All Tools</option>
                </select>
                <input type="date" id="filter-from" onchange="loadSessions(1)" placeholder="From date">
                <input type="date" id="filter-to" onchange="loadSessions(1)" placeholder="To date">
                <input type="text" id="filter-project" placeholder="Project path..." onkeydown="if(event.key==='Enter')loadSessions(1)">
            </div>
            <div id="browse-sessions" class="session-list"></div>
            <div id="browse-pagination" class="pagination"></div>
        </div>

        <!-- Session Detail -->
        <div id="view-session" class="view hidden">
            <div class="session-header" id="session-header"></div>
            <div class="message-thread" id="message-thread"></div>
        </div>

        <!-- Search Results -->
        <div id="view-search" class="view hidden">
            <h2 id="search-title">Search Results</h2>
            <div id="search-results" class="search-results"></div>
            <div id="search-pagination" class="pagination"></div>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
