[project]
name = "oneagent"
version = "0.1.0"
description = "Unified Personal Super-App - Self-building, self-extending agentic platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hassan Saeed"}
]
keywords = ["ai", "agent", "llm", "automation", "fhir", "leap"]

dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.16",
    "openai>=1.12.0",
    "anthropic>=0.21.0",
    "ollama>=0.1.6",
    "chromadb>=0.4.22",
    "redis>=5.0.1",
    "google-generativeai>=0.4.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "httpx>=0.27.0",
]
celery = [
    "celery>=5.3.0",
]

[project.scripts]
oneagent = "oneagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
